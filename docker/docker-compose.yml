name: second-brain

# ─── Network ─────────────────────────────────────────────────────────────────
# A single named bridge network gives every service DNS resolution via its
# service name (e.g. the backend reaches Qdrant at http://qdrant:6333).
# Without an explicit network, Docker uses a default bridge that does NOT
# guarantee service-name DNS.
networks:
  second-brain-net:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────────────────
# Named volumes survive container restarts and rebuilds.
# docker volume ls  →  lists them
# docker volume rm  →  wipes data (useful to reset Qdrant or Ollama state)
volumes:
  qdrant_data:   # Qdrant collection storage — persists embeddings across restarts
  ollama_data:   # Ollama model weights — prevents re-downloading on every up

# ─── Services ────────────────────────────────────────────────────────────────
services:

  # ── Qdrant ─────────────────────────────────────────────────────────────────
  # Vector database. Stores and searches embeddings.
  #
  # Ports:
  #   6333 → REST API + built-in web UI (http://localhost:6333/dashboard)
  #   6334 → gRPC (high-throughput; unused in dev but useful for prod tuning)
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: second-brain-qdrant
    networks: [second-brain-net]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Ollama ─────────────────────────────────────────────────────────────────
  # Local LLM runtime. Serves embedding and chat models.
  #
  # Ports:
  #   11434 → Ollama REST API (used by LlamaIndex to embed and generate)
  #
  # GPU passthrough: uncomment the `deploy` block if you have an NVIDIA GPU.
  # CPU-only works fine for llama3.2 at small context sizes.
  ollama:
    image: ollama/ollama:0.5.1
    container_name: second-brain-ollama
    networks: [second-brain-net]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Ollama Init ────────────────────────────────────────────────────────────
  # One-shot service that pulls required models into the shared ollama_data
  # volume. Runs only once per `docker compose up`; exits 0 when done.
  # If models are already cached, `ollama pull` is a fast no-op.
  # This service deliberately does NOT block the backend — the backend starts
  # as soon as Ollama's HTTP server is healthy, not after models are loaded.
  ollama-init:
    image: ollama/ollama:0.5.1
    container_name: second-brain-ollama-init
    networks: [second-brain-net]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "==> Pulling nomic-embed-text (embedding model)..."
        ollama pull nomic-embed-text
        echo "==> Pulling llama3.2 (chat model)..."
        ollama pull llama3.2
        echo "==> Models ready."
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── Backend ────────────────────────────────────────────────────────────────
  # FastAPI application. Handles ingestion, retrieval, and chat.
  #
  # Ports:
  #   8000 → FastAPI HTTP API + /docs (Swagger UI, dev only)
  #
  # Volumes:
  #   app/     → bind-mounted so uvicorn --reload picks up code changes
  #   vault/   → Obsidian notes, read-only inside the container
  #
  # environment overrides take precedence over .env — this is where Docker
  # service-name hostnames replace the localhost defaults in .env.example.
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
      target: dev
    container_name: second-brain-backend
    networks: [second-brain-net]
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app          # hot reload — source changes take effect immediately
      - ../vault:/app/vault:ro           # read-only vault mount
    environment:
      DEBUG: "true"
      QDRANT_HOST: qdrant                # Docker service name, not localhost
      OLLAMA_BASE_URL: http://ollama:11434
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    env_file:
      - ../backend/.env                  # falls back to .env.example values for everything else
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ───────────────────────────────────────────────────────────────
  # Nuxt 3 dev server with Vite HMR.
  #
  # Ports:
  #   3000  → Nuxt dev server (page requests)
  #   24678 → Vite HMR WebSocket (live reload without full page refresh)
  #
  # Volumes:
  #   /app             → bind-mount entire frontend for hot reload
  #   /app/node_modules → anonymous volume preserves container's installed
  #                       packages; prevents the host from shadowing them
  #   /app/.nuxt       → anonymous volume preserves Nuxt's build cache
  #
  # NUXT_PUBLIC_API_BASE uses localhost:8000 — this value is embedded into the
  # browser bundle at build time, so it must be the address the *browser*
  # can reach, not the address the frontend container can reach internally.
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      target: dev
    container_name: second-brain-frontend
    networks: [second-brain-net]
    ports:
      - "3000:3000"
      - "24678:24678"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.nuxt
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
      CHOKIDAR_USEPOLLING: "true"        # reliable file-watch on Linux/WSL bind mounts
    depends_on:
      - backend
    restart: unless-stopped
